<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TARGET | لتجهيزات الأجهزة والمعدات</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme">

    <header class="main-header">
        <div class="logo animate__animated animate__fadeInRight">TARGET <span class="logo-sub">TECH</span></div>
        
        <nav class="nav-links">
            <button class="filter-btn active" onclick="filterCategory('الكل')">الكل</button>
            <button class="filter-btn" onclick="filterCategory('ثلاجات')">ثلاجات</button>
            <button class="filter-btn" onclick="filterCategory('بوتاجازات')">بوتاجازات</button>
            <button class="filter-btn" onclick="filterCategory('أيس كريم')">ماكينات أيس كريم</button>
        </nav>
        
        <div class="header-actions animate__animated animate__fadeInLeft">
            <button class="theme-toggle-btn" id="theme-toggle" onclick="toggleTheme()" title="تغيير المظهر">
                <i class="fas fa-moon" id="theme-icon"></i>
            </button>
            <button class="cart-btn" id="cart-btn" onclick="toggleCart()">
                <span class="cart-count" id="cart-count">0</span>
                <i class="fas fa-shopping-cart"></i>
                <span>السلة</span>
            </button>
        </div>
    </header>

    <section class="hero-section">
        <div class="hero-overlay"></div>
        <div class="hero-content animate__animated animate__zoomIn">
            <span class="hero-badge"><i class="fas fa-certificate"></i> أجهزة ومعدات عالية الجودة</span>
            <h1>مؤسسة TARGET</h1>
            <p>     تارجت الهرم للتجهيزات الفندقيه  .</p>
            <div class="hero-buttons">
                <a href="#products" class="btn btn-primary"><i class="fas fa-th-large"></i> استعرض المنتجات</a>
            </div>
        </div>
    </section>

    <section id="products" class="products-section">
        <div class="section-title">
            <h2 id="current-category-title">منتجات TARGET المميزة</h2>
            <p>اختر القسم المطلوب للاطلاع على المنتجات والمواصفات</p>
        </div>
        
        <div class="products-grid" id="products-container">
            <p style="text-align: center; grid-column: 1/-1; opacity: 0.6;">جاري تحميل المنتجات...</p>
        </div>
    </section>

    <div id="cart-sidebar" class="cart-sidebar">
        <div class="cart-sidebar-header">
            <h3><i class="fas fa-shopping-basket"></i> قائمة الطلبات</h3>
            <button class="close-cart-btn" onclick="toggleCart()"><i class="fas fa-times"></i></button>
        </div>
        
        <div id="cart-items" class="cart-items-container">
            <div class="empty-cart-msg">
                <i class="fas fa-shopping-cart" style="font-size: 40px; margin-bottom: 15px; opacity: 0.3;"></i>
                <p>لم تقم بإضافة أي أجهزة للسلة بعد.</p>
            </div>
        </div>

        <div class="cart-sidebar-footer">
            <div class="total-price-wrapper">
                <span>الإجمالي الكلي:</span>
                <span id="total-price">0 ج.م</span>
            </div>
            <button class="checkout-whatsapp-btn" onclick="checkoutToWhatsapp()">
                <i class="fab fa-whatsapp"></i> إرسال الطلب عبر الواتساب
            </button>
        </div>
    </div>

    <div id="cart-overlay" class="cart-overlay" onclick="toggleCart()"></div>

    <script>
        // رابط API الخاص بك في SheetDB
        const SHEETDB_API_URL = "https://sheetdb.io/api/v1/5gxkyrsbgig10"; 
        const MY_WHATSAPP_NUMBER = "201011311295"; // رقم الواتساب لتلقي الطلبات

        let cart = [];
        let allProducts = [];

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'dark') {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                document.getElementById('theme-icon').className = 'fas fa-sun';
            }
            fetchProducts();
        });

        function toggleTheme() {
            const body = document.body;
            const themeIcon = document.getElementById('theme-icon');
            
            if (body.classList.contains('light-theme')) {
                body.classList.remove('light-theme');
                body.classList.add('dark-theme');
                themeIcon.className = 'fas fa-sun';
                localStorage.setItem('theme', 'dark');
            } else {
                body.classList.remove('dark-theme');
                body.classList.add('light-theme');
                themeIcon.className = 'fas fa-moon';
                localStorage.setItem('theme', 'light');
            }
        }

        function fetchProducts() {
            fetch(SHEETDB_API_URL)
                .then(response => response.json())
                .then(products => {
                    allProducts = products;
                    displayProducts(allProducts);
                })
                .catch(error => {
                    console.error("خطأ في جلب المنتجات:", error);
                    document.getElementById('products-container').innerHTML = `
                        <p style="text-align: center; grid-column: 1/-1; color: red;">
                            عذراً، تعذر تحميل المنتجات. تحقق من الاتصال أو إعدادات SheetDB.
                        </p>`;
                });
        }

        function displayProducts(products) {
            const container = document.getElementById('products-container');
            container.innerHTML = "";

            if (products.length === 0) {
                container.innerHTML = '<p style="text-align: center; grid-column: 1/-1; opacity: 0.6;">لا توجد أجهزة متوفرة في هذا القسم حالياً.</p>';
                return;
            }

            products.forEach((product, index) => {
                const title = product.title || product.Title || product.الاسم || "جهاز TARGET";
                const price = parseFloat(product.price || product.Price || product.السعر) || 0;
                const category = product.category || product.Category || product.القسم || "أجهزة";
                const image = product.image || product.Image || product.الصورة || "https://images.unsplash.com/photo-1584622650111-993a426fbf0a?auto=format&fit=crop&w=500&q=80";
                const badge = product.badge || product.Badge || product.شارة || "";

                const badgeHTML = badge ? `<div class="product-badge">${badge}</div>` : '';

                const cardHTML = `
                    <div class="product-card animate__animated animate__fadeInUp" style="animation-delay: ${index * 0.05}s;">
                        ${badgeHTML}
                        <div class="product-image-wrapper">
                            <img src="${image}" alt="${title}" class="product-img" onerror="this.src='https://images.unsplash.com/photo-1584622650111-993a426fbf0a?auto=format&fit=crop&w=500&q=80'">
                        </div>
                        <div class="product-info">
                            <span class="product-category">${category}</span>
                            <h3>${title}</h3>
                            <div class="product-footer">
                                <span class="price">${price} <span class="currency">ج.م</span></span>
                                <button class="add-to-cart-btn" onclick="addToCart('${title.replace(/'/g, "\\'")}', ${price})">
                                    <i class="fas fa-cart-plus"></i> إضافة للسلة
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        function filterCategory(categoryName) {
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const titleElement = document.getElementById('current-category-title');
            if (categoryName === 'الكل') {
                titleElement.innerText = "منتجات TARGET المميزة";
                displayProducts(allProducts);
            } else {
                titleElement.innerText = `قسم ${categoryName}`;
                const filtered = allProducts.filter(p => {
                    const productCat = (p.category || p.Category || p.القسم || "").trim().toLowerCase();
                    const targetCat = categoryName.trim().toLowerCase();
                    const normalize = (str) => str.replace(/[أإآا]/g, 'ا').replace(/ال/g, '');
                    return normalize(productCat).includes(normalize(targetCat)) || normalize(targetCat).includes(normalize(productCat));
                });
                displayProducts(filtered);
            }
        }

        function toggleCart() {
            document.getElementById('cart-sidebar').classList.toggle('open');
            document.getElementById('cart-overlay').classList.toggle('active');
        }

        function addToCart(productName, price) {
            const existingItem = cart.find(item => item.name === productName);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ name: productName, price: price, quantity: 1 });
            }
            updateCartUI();
            
            const cartBtn = document.getElementById('cart-btn');
            cartBtn.classList.add('pulse-effect');
            setTimeout(() => cartBtn.classList.remove('pulse-effect'), 400);
        }

        function updateCartUI() {
            const cartItemsContainer = document.getElementById('cart-items');
            const cartCountElement = document.getElementById('cart-count');
            const totalPriceElement = document.getElementById('total-price');
            
            let totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartCountElement.innerText = totalItems;

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = `
                    <div class="empty-cart-msg">
                        <i class="fas fa-shopping-cart" style="font-size: 40px; margin-bottom: 15px; opacity: 0.3;"></i>
                        <p>لم تقم بإضافة أي أجهزة للسلة بعد.</p>
                    </div>`;
                totalPriceElement.innerText = '0 ج.م';
                return;
            }

            cartItemsContainer.innerHTML = ''; 
            let totalCost = 0;

            cart.forEach((item, index) => {
                totalCost += item.price * item.quantity;
                const itemHTML = `
                    <div class="cart-item animate__animated animate__fadeIn">
                        <div class="item-info">
                            <h4>${item.name}</h4>
                            <span class="item-price">${item.price} ج.م × ${item.quantity}</span>
                        </div>
                        <button class="remove-item-btn" onclick="removeFromCart(${index})">
                            <i class="fas fa-trash-alt"></i> حذف
                        </button>
                    </div>`;
                cartItemsContainer.innerHTML += itemHTML;
            });

            totalPriceElement.innerText = `${totalCost} ج.م`;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function checkoutToWhatsapp() {
            if (cart.length === 0) {
                alert('السلة فارغة! يرجى اختيار المنتجات أولاً.');
                return;
            }

            let message = `مرحباً TARGET 🎯\nأود طلب الأجهزة التالية:\n\n`;
            let totalCost = 0;

            cart.forEach((item, index) => {
                let itemTotal = item.price * item.quantity;
                totalCost += itemTotal;
                message += `${index + 1}. *${item.name}* \n`;
                message += `   الكمية: ${item.quantity} | السعر: ${itemTotal} ج.م\n\n`;
            });

            message += `-------------------------\n`;
            message += `💰 *الإجمالي:* ${totalCost} ج.م\n\n`;
            message += `يرجى التواصل لترتيب تفاصيل الشحن والتسليم.`;

            const encodedMessage = encodeURIComponent(message);
            const whatsappURL = `https://api.whatsapp.com/send?phone=${MY_WHATSAPP_NUMBER}&text=${encodedMessage}`;
            window.open(whatsappURL, '_blank');
        }
    </script>
</body>
</html>
